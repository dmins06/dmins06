
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360">

  <defs>
    <linearGradient id="meteor">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 112px;
        font-weight: 900;
        letter-spacing: 10px;
        fill: white;
      }

      .title-main {
        animation: fade 6s ease-in-out infinite;
      }

      .title-glow {
        animation: glowFade 6s ease-in-out infinite;
      }

      @keyframes fade {
        0%, 100% {
          opacity: 0.05;
          filter: blur(8px);
        }
        35%, 65% {
          opacity: 1;
          filter: blur(0);
        }
      }

      @keyframes glowFade {
        0%, 100% { opacity: 0; }
        35% { opacity: .7; }
        50% { opacity: .3; }
        65% { opacity: .7; }
      }

      .star {
        animation: twinkle 2s ease-in-out infinite alternate;
      }

      @keyframes twinkle {
        from { opacity: .1; }
        to { opacity: 1; }
      }

      .meteor {
        stroke: url(#meteor);
        stroke-width: 2;
        stroke-linecap: round;
        animation: fall 5s linear infinite;
        opacity: 0;
      }

      .m2 { animation-delay: 1.8s; }
      .m3 { animation-delay: 3.5s; }

      @keyframes fall {
        0% {
          opacity: 0;
          transform: translate(0,0);
        }
        5% { opacity: 1; }
        25% {
          opacity: 0;
          transform: translate(-300px,200px);
        }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- BLACK SPACE -->
  <rect width="1200" height="360" fill="#000"/>

  <!-- STARS -->
  <g fill="white">
    <circle cx="55" cy="50" r="1"/>
    <circle cx="120" cy="180" r="1.2"/>
    <circle cx="200" cy="75" r="1"/>
    <circle cx="280" cy="290" r="1.2"/>
    <circle cx="350" cy="40" r="1"/>
    <circle cx="440" cy="300" r="1"/>
    <circle cx="510" cy="75" r="1.2"/>
    <circle cx="670" cy="45" r="1"/>
    <circle cx="750" cy="300" r="1"/>
    <circle cx="830" cy="65" r="1.2"/>
    <circle cx="920" cy="40" r="1"/>
    <circle cx="1010" cy="110" r="1"/>
    <circle cx="1120" cy="55" r="1.2"/>
    <circle cx="1160" cy="280" r="1"/>
    <circle cx="90" cy="270" r="1"/>
    <circle cx="320" cy="190" r="1"/>
    <circle cx="890" cy="250" r="1"/>
    <circle cx="1080" cy="210" r="1"/>
  </g>

  <!-- TWINKLING STARS -->
  <g fill="#fff">
    <circle class="star" cx="170" cy="100" r="2"/>
    <circle class="star" cx="290" cy="250" r="1.5"
            style="animation-delay:.7s"/>
    <circle class="star" cx="410" cy="65" r="2"
            style="animation-delay:1.2s"/>
    <circle class="star" cx="510" cy="280" r="1.5"
            style="animation-delay:.4s"/>
    <circle class="star" cx="750" cy="90" r="2"
            style="animation-delay:1.5s"/>
    <circle class="star" cx="850" cy="270" r="1.5"
            style="animation-delay:.8s"/>
    <circle class="star" cx="990" cy="80" r="2"
            style="animation-delay:1.1s"/>
    <circle class="star" cx="1100" cy="180" r="1.8"
            style="animation-delay:.3s"/>
  </g>

  <!-- SHOOTING STARS -->
  <g fill="none">
    <path class="meteor" d="M1150 20 L1050 90"/>
    <path class="meteor m2" d="M800 0 L700 75"/>
    <path class="meteor m3" d="M500 10 L410 75"/>
  </g>

  <!-- TEXT GLOW -->
  <text x="600" y="190"
        text-anchor="middle"
        class="title title-glow"
        filter="url(#glow)">DIMINN.</text>

  <!-- MAIN TEXT -->
  <text x="600" y="190"
        text-anchor="middle"
        class="title title-main">DIMINN.</text>

  <!-- SUBTITLE -->
  <text x="600" y="240"
        text-anchor="middle"
        fill="#888"
        font-family="Arial"
        font-size="14"
        letter-spacing="5">
    DATA SCIENCE | DATA ENGINEERING | AI
  </text>

</svg>
